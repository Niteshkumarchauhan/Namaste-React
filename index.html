<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
    <title>Namaste React</title>
</head>

<body>
    <!-- Root element where React will mount the application -->
    <!-- The content inside will be replaced by React -->
    <div id="root">
        <h1>Nitesh is here</h1>
    </div>

    <!-- React library - Core React functionality -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- ReactDOM library - React's DOM rendering functionality -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Our custom React application code -->
    <script src="App.js"></script>
</body>

</html>
